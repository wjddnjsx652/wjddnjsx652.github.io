<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>정원택 포트폴리오</title>
  <meta name="description" content="전기차 충전 인프라 시험·인증·구축 경력 포트폴리오">
  <meta name="theme-color" content="#080c14">
  <!-- 검색엔진에 노출하지 않고, 링크를 아는 사람만 보게 하려는 설정입니다. 검색 노출을 원하면 아래 줄을 지우세요. -->
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 첫 화면 이름표(Jeong Won-taek)에만 쓰는 영문 필기체풍 글꼴. 불러오지 못하면 기본 세리프체로 대체됩니다. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#app">본문으로 건너뛰기</a>
  <header class="gnb" id="gnb"></header>
  <main id="app"></main>
  <footer class="foot" id="foot"></footer>

  <!-- 프로젝트 상세 페이지 -->
  <div class="proj" id="proj" role="dialog" aria-modal="true" aria-label="프로젝트 상세" aria-hidden="true">
    <button class="proj-close" type="button" aria-label="닫기" data-close-proj></button>
    <div class="proj-in">
      <aside class="proj-side" id="projSide"></aside>
      <div class="proj-main" id="projBody"></div>
    </div>
  </div>

  <!-- 사진 확대 -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="이미지 확대" aria-hidden="true">
    <button class="lb-btn lb-close" type="button" aria-label="닫기" data-lb="close"></button>
    <button class="lb-btn lb-prev" type="button" aria-label="이전 사진" data-lb="prev"></button>
    <figure class="lb-fig">
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="lb-btn lb-next" type="button" aria-label="다음 사진" data-lb="next"></button>
    <span class="lb-count" id="lbCount"></span>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/evidence-local.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
